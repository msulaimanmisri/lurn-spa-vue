# ========
# Network and Volume Definitions
# ========
networks:
  spavue-network:
    driver: bridge

volumes: 
  mariadb_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

# ========
# Docker Compose Configuration for Laravel Application
# ========
services:
  ## FrankenPHP (Caddy + PHP)
  app:
    container_name: spavue-app
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile

    working_dir: /app
    ports:
      - "8000:8000"
    command:
      - php
      - artisan
      - octane:frankenphp
      - --host=0.0.0.0
      - --port=8000
      - --workers=auto
      - --max-requests=500
      - --watch
      - --poll
    volumes:
      - ./:/app
      - ./docker/frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - spavue-network
    depends_on:
      - database

  ## MariaDB Database
  database:
    image: mariadb:latest
    container_name: spavue-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - spavue-network

  ## Redis
  redis:
    image: redis:alpine
    container_name: spavue-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - spavue-network

  ## PHPMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: spavue-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: database
      PMA_USER: ${DB_USERNAME}
      PMA_PASSWORD: ${DB_PASSWORD}
      PMA_DATABASE: ${DB_DATABASE}
    networks:
      - spavue-network
    depends_on:
      - database
